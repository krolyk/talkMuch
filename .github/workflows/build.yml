name: Java P2P Chat CI/CD Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-package:
    runs-on: windows-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build Executable JAR with Maven
      run: mvn clean package

    - name: Generate Native Windows MSI Installer
      run: |
        jpackage --type msi `
                 --name "TalkMuchChat" `
                 --input target/ `
                 --main-jar talkmuch-chat-1.0.0.jar `
                 --main-class com.talkmuch.P2PChat `
                 --win-dir-chooser `
                 --win-shortcut `
                 --win-console

    - name: Upload Installer Artifact to GitHub
      uses: actions/upload-artifact@v4
      with:
        name: TalkMuch-Windows-Installer
        path: "*.msi"
